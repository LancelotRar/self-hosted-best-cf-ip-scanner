<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0F172A" />
    <title>运维面板 · 优选IP扫描器</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="正在加载面板">
        <span class="boot__mark" aria-hidden="true">CF</span>
        <span class="boot__track" aria-hidden="true"><span class="boot__bar"></span></span>
      </div>
    </div>
    <style>
      /* 首屏静态占位：Vue 挂载后会被替换，避免跨网访问时出现白屏 */
      body {
        margin: 0;
      }
      .boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #f5f6f8;
      }
      html[data-theme="dark"] .boot {
        background: #0b0d10;
      }
      .boot__mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: #17191d;
        color: #fff;
        font: 700 12px/1 Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.04em;
      }
      html[data-theme="dark"] .boot__mark {
        background: #eef0f3;
        color: #14171c;
      }
      .boot__track {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgb(0 0 0 / 8%);
      }
      html[data-theme="dark"] .boot__track {
        background: rgb(255 255 255 / 10%);
      }
      .boot__bar {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #17191d;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      html[data-theme="dark"] .boot__bar {
        background: #eef0f3;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
