name: Feature request
description: 提出功能或改进建议
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前行为、使用场景与痛点，而不是直接给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可选；说明它如何影响现有 compose、面板或扫描器边界。
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不包含密钥、令牌或宿主敏感信息
          required: true
