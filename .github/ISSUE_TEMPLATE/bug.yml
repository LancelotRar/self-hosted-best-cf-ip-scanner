name: Bug report
description: 报告可复现的缺陷（不要包含令牌、密码或宿主敏感路径）
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请不要用公开 Issue 报告，见 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本 / 镜像标签
      placeholder: 例如 ghcr.io/...:1.0.0 或 commit sha
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 官方镜像 + compose.example.yaml
        - 官方镜像 + compose.control.yaml
        - 本地构建
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小、可重复的步骤；包含预期结果与实际结果。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请先脱敏；不要粘贴令牌、Cookie、完整配置。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已确认不是 SECURITY.md 中列出的安全报告场景
          required: true
        - label: 已移除令牌、密码、Cookie 与宿主敏感路径
          required: true
