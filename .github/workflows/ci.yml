name: ci

on:
  push:
    branches: ["main"]
    # 纯文档改动（README / docs / LICENSE）不触发 CI
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 用示例配置校验 compose 语法与变量插值，防止模板之间漂移
      - run: cp compose.example.yaml compose.yaml
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet

  smoke:
    name: image smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 真正把镜像跑起来：入口脚本、crontab 渲染、目录可写性检查都在启动路径上，
      # 只"构建成功"不足以证明镜像可用。
      - name: Build and start
        run: |
          cp compose.example.yaml compose.yaml
          cp .env.example .env
          sed -i 's|^PROBE_HOST=.*|PROBE_HOST=probe.example.com|' .env
          # 冒烟测试只验证启动路径，不跑整轮扫描
          sed -i 's|^RUN_ON_START=.*|RUN_ON_START=false|' .env
          sed -i 's|^MAX_CANDIDATES=.*|MAX_CANDIDATES=10|' .env
          docker compose -f compose.yaml -f compose.build.yaml up -d --build
          docker compose ps
      - name: Wait for healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' best-cf-ip-scanner 2>/dev/null || echo starting)
            echo "health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "容器未在 60s 内变为 healthy" >&2
          exit 1
      - name: Verify scheduler is running
        run: |
          docker compose exec -T scanner sh -c 'pidof supercronic && ls -l /data/ip-library.txt && test -w /output'
          docker compose exec -T scanner /usr/local/bin/doctor.sh | head -30
      - name: Show logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml down -v
