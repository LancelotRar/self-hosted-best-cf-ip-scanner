name: ci

on:
  push:
    branches: ["main"]
    # 纯文档改动（README / docs / LICENSE）不触发 CI
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-panel.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-panel.txt -r requirements-dev.txt
      - name: Dependency conflicts
        run: pip check
      - name: Unit and API tests with coverage
        run: |
          pytest -q \
            --cov=panel \
            --cov=scanner \
            --cov-fail-under=80

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - run: npm --prefix web run test

  contract:
    name: script and compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: sh -n docker/*.sh scripts/*.sh
      - name: Compose config
        run: |
          cp compose.example.yaml compose.yaml
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          docker compose -f compose.yaml -f compose.control.yaml config --quiet

  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build scanner image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: scanner
          platforms: linux/amd64
          push: false
          load: true
          tags: best-cf-ip-scanner:ci
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner

      - name: Build panel image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: panel
          platforms: linux/amd64
          push: false
          load: true
          tags: best-cf-ip-scanner-panel:ci
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel

      - name: Trivy scanner image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: best-cf-ip-scanner:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: Trivy panel image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: best-cf-ip-scanner-panel:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt requirements-panel.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit
        run: |
          npm ci --prefix web
          npm audit --omit=dev --audit-level=high

  smoke:
    name: image smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 真正把镜像跑起来：入口脚本、crontab 渲染、面板启动、目录可写性都在启动路径上，
      # 只"构建成功"不足以证明镜像可用。
      - name: Build and start
        run: |
          cp compose.example.yaml compose.yaml
          docker compose -f compose.yaml -f compose.build.yaml up -d --build
          docker compose ps
      - name: Wait for scanner healthy
        run: |
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' best-cf-ip-scanner 2>/dev/null || echo starting)
            echo "scanner health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "扫描容器未在 90s 内变为 healthy" >&2
          exit 1
      - name: Verify scheduler and doctor
        run: |
          docker compose exec -T scanner sh -c 'pidof supercronic && ls -l /data/ip-library.txt && test -w /output'
          docker compose exec -T scanner /usr/local/bin/doctor.sh | head -30
      - name: Verify panel is serving
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q "运维面板"
      - name: Verify default security posture
        run: |
          docker compose exec -T panel sh -c 'test ! -S /var/run/docker.sock'
          docker inspect best-cf-ip-scanner-panel --format '{{json .HostConfig.CapDrop}}' | grep -q ALL
          docker inspect best-cf-ip-scanner-panel --format '{{json .HostConfig.SecurityOpt}}' | grep -q no-new-privileges
          docker compose port panel 8080 | grep -q '^127.0.0.1:'
      - name: Verify config projection is re-read every round
        run: sh scripts/test-config-projection.sh
      - name: Verify explicit env beats projection
        run: |
          docker compose run --rm -T -e SAMPLE_STRIDE=512 \
            --entrypoint python scan-once /usr/local/bin/print-config.py --json \
            > /tmp/print-config.json
          python - <<'PY'
          import json
          value = json.load(open("/tmp/print-config.json"))["SAMPLE_STRIDE"]["value"]
          assert value == 512, value
          print("run -e override ok:", value)
          PY
      - name: Show logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml down -v

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend deps and browser
        run: |
          npm ci --prefix web
          npm --prefix web exec playwright install --with-deps chromium
      - name: Start clean stack
        run: |
          rm -rf panel-data
          cp compose.example.yaml compose.yaml
          # e2e 需要日志页/运行页的真实容器控制，显式追加控制覆盖层。
          docker compose -f compose.yaml -f compose.build.yaml -f compose.control.yaml up -d --build
          for _ in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          echo "面板未在 90s 内就绪" >&2
          docker compose logs --no-color panel
          exit 1
      - name: Run Playwright
        run: npm --prefix web run e2e
        env:
          PANEL_URL: http://127.0.0.1:8080
          E2E_PASSWORD: e2e-correct-horse
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
      - name: Show logs
        if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml -f compose.control.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml -f compose.control.yaml down -v
