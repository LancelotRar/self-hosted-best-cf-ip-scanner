# 本地构建覆盖层（维护者 / 离线环境 / 改过代码之后）
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# 构建产物直接打上 compose.yaml 里的镜像名（本地优先于拉取），不涉及推送。
# 构建参数直接写在这里；需要代理时用 --build-arg 或修改本文件。
name: best-cf-ip-scanner

services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
      target: scanner
      args:
        # 调度器版本；Dockerfile 内置各架构校验和，升级时同步改 Dockerfile
        SUPERCRONIC_VERSION: v0.2.51
        # 镜像加速（可选）：留空使用官方源
        APK_MIRROR: ""
        PIP_INDEX_URL: https://pypi.org/simple

  panel:
    build:
      context: .
      dockerfile: Dockerfile
      target: panel
      args:
        APK_MIRROR: ""
        PIP_INDEX_URL: https://pypi.org/simple
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org
