# best-cf-ip-scanner —— 运行配置（官方镜像）
#
#   1) 本文件复制为 compose.yaml
#   2) 需要改运行身份、端口或镜像版本时，直接编辑本文件（部署参数只在这里）
#   3) docker compose up -d && docker compose logs -f
#   4) 浏览器打开面板，在「参数」页填写探测域名等应用参数
#
# 手动执行一轮：docker compose run --rm scan-once
#
# 数据卷（命名卷，宿主目录里看不到文件）：
#   ip-data        输入：候选地址库 + 机房映射（面板里编辑，数据库为唯一真源）
#   scan-output    产物：明细表 detail.csv + 订阅列表 GLOBAL{N}.txt / {国家代码}{N}.txt
#   publish-cache  发布缓存：目标仓库的浅克隆（可随时删除）
#   scanner-config 运行配置投影：面板写入，扫描器只读
#
# 拉取官方镜像并启动：
#   docker compose up -d
# 本地构建镜像（维护者 / 离线环境）：见 docs/deployment.md 的 docker build 命令。
#
# 默认不挂载 docker.sock：面板只做配置、产物与审计，容器控制（日志/立即执行/启停）
# 默认不可用。需要这些能力时启用 control profile，并把控制地址指向 sidecar：
#   SCANNER_CONTROL_URL=http://scanner-control:8090 docker compose --profile control up -d
# 注意：sidecar 仍持有 docker.sock，等价于宿主机 root，仅在可信网络使用。
name: best-cf-ip-scanner

# 两个服务（常驻调度 / 一次性执行）共用同一份运行配置，避免参数漂移
x-scanner-common: &scanner-common
  # 官方镜像（多架构 amd64/arm64）。锁定版本时直接改这里的标签。
  image: ghcr.io/lancelotrar/self-hosted-best-cf-ip-scanner:latest
  # 应用参数由面板写入 /scanner-config/runtime.json，扫描器每轮自己重新读取。
  # 这里只保留部署参数（运行身份）与容器内固定路径；显式 environment 仍优先。
  environment:
    RUNTIME_CONFIG_PATH: /scanner-config/runtime.json
    PUID: "1000"
    PGID: "1000"
    OUTPUT_DIR: /output
    DATA_DIR: /data
    GIT_REPO_DIR: /cache/repo
  # 面板先启动并生成运行配置投影；投影不存在时扫描器不进入调度。
  depends_on:
    panel:
      condition: service_healthy
  # 最小权限：只读根文件系统
  read_only: true
  tmpfs:
    - /tmp:size=64m
  # 入口以 root 只做「挂载目录 chown + su-exec 降权」，
  # 因此只放这几步必需的五个能力；降权后业务进程不带任何 root 能力。
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
  security_opt:
    - no-new-privileges:true
  # 200 并发 socket 需要足够的 fd；限制异常轮次对宿主的影响。
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  pids_limit: 512
  mem_limit: 1g
  volumes:
    # IP 库与 IATA 映射：面板写入数据库后投影到卷里，只给扫描器读（宿主不可见）
    - ip-data:/data
    # 产物：明细表 + 订阅列表，写入卷后由面板入库展示（宿主不可见）
    - scan-output:/output
    # 发布缓存：目标仓库的浅克隆，删掉卷即可让下一轮重新克隆
    - publish-cache:/cache
    # 运行配置投影：只有面板写，扫描器只读
    - scanner-config:/scanner-config:ro

services:
  # 常驻服务：容器内按 CRON_SCHEDULE 调度
  scanner:
    <<: *scanner-common
    container_name: best-cf-ip-scanner
    # 单机常驻：随宿主机/守护进程重启自动恢复；每轮任务幂等
    restart: unless-stopped
    # 停止时给当前这一轮留出收尾时间（全量约 2 分钟），避免正在推送产物时被 SIGKILL。
    # 想立刻停可以 docker compose stop -t 5。
    stop_grace_period: 150s
    # 调度器是常驻进程；进程在 = 健康。业务失败只体现在日志与退出码里，
    # 不把"上一轮扫描失败"误报成容器故障。
    # start_period 放宽到 5 分钟：RUN_ON_START=true 时容器会先跑完整轮扫描
    # （全量约 2~5 分钟），期间 supercronic 还没接管，过早判死会误导运维。
    healthcheck:
      test: ["CMD", "pidof", "supercronic"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 5m
    # 日志落盘上限：长期运行不让 json-file 无限增长
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 一次性服务：手动补跑一轮，跑完即退出（用 run --rm 调用，不参与 up）
  #   docker compose run --rm scan-once
  # 与常驻服务共用锁：若定时任务正在跑，本次会提示并跳过，不会并发写产物。
  scan-once:
    <<: *scanner-common
    profiles: ["manual"]
    restart: "no"
    entrypoint: ["/usr/local/bin/scan-and-publish.sh"]

  # 运维面板：与扫描器同一镜像、同一 compose 项目。
  #   默认只监听 127.0.0.1:8080；远程访问请用 SSH 隧道或 TLS 反向代理。
  # 以 root 运行只为把数据卷文件属主对齐到 PUID/PGID；不挂 docker.sock。
  # 需要容器控制时启用 control profile（见文件头说明）。
  # 面板是应用配置的唯一入口：配置存数据库，并生成扫描器读取的 /scanner-config/runtime.json。
  panel:
    image: ghcr.io/lancelotrar/self-hosted-best-cf-ip-scanner-panel:latest
    container_name: best-cf-ip-scanner-panel
    entrypoint: ["/usr/local/bin/panel-entrypoint.sh"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CONFIG_DIR: /scanner-config
      DEFAULT_DATA_DIR: /opt/default-data
      PANEL_DATA_DIR: /panel-data
      PANEL_PORT: "8080"
      PUID: "1000"
      PGID: "1000"
      SCANNER_CONTAINER: best-cf-ip-scanner
      SCANNER_IMAGE: ghcr.io/lancelotrar/self-hosted-best-cf-ip-scanner:latest
      DATA_DIR: /data
      OUTPUT_DIR: /output
      CACHE_DIR: /cache
      PANEL_TRUST_PROXY: "false"
      PANEL_SESSION_DAYS: "7"
      # 启用 control profile 时由部署者显式传入；默认空值表示不启用容器控制。
      SCANNER_CONTROL_URL: "${SCANNER_CONTROL_URL:-}"
      # 首次设置口令（可选）：设置后首次设置页会要求输入同一个值。
      # PANEL_SETUP_TOKEN: "change-me"
      HOME: /tmp
    volumes:
      - ip-data:/data
      # 面板只读取产物与锁文件，不需要写权限
      - scan-output:/output:ro
      - publish-cache:/cache:ro
      - ./panel-data:/panel-data
      # 运行配置投影：面板唯一写入方，扫描器只读挂载
      - scanner-config:/scanner-config
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # 面板仍以 root 启动完成卷属主对齐，但默认不带任何额外能力。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - control
    pids_limit: 256
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选控制 sidecar：只有它挂载 docker.sock，面板通过内部 control 网络调用。
  # 启用方式：SCANNER_CONTROL_URL=http://scanner-control:8090 docker compose --profile control up -d
  scanner-control:
    profiles: ["control"]
    image: ghcr.io/lancelotrar/self-hosted-best-cf-ip-scanner-panel:latest
    container_name: best-cf-ip-scanner-control
    entrypoint: ["python", "-m", "panel.control_sidecar"]
    environment:
      SCANNER_CONTAINER: best-cf-ip-scanner
      CONTROL_PORT: "8090"
      SCANNER_CONTROL_TOKEN: "${SCANNER_CONTROL_TOKEN:-}"
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    networks:
      - control
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


# 命名卷：数据与产物都不再落宿主目录，只能在面板里查看/编辑
volumes:
  ip-data:
  scan-output:
  publish-cache:
  scanner-config:

networks:
  control:
    internal: true
